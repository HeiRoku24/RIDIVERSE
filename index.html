<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1240">
<title>리디 게임 (교육용 데모)</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/fonts/pretendard/pretendard.css">
<link rel="stylesheet" href="assets/css/site.css"><script src="assets/js/demo.js"></script></head>
<body>
<div id="hd"></div>
<!-- 히어로: 3게임 자동 슬라이드(5초) · 그림은 HERO 배열의 img만 바꾸면 교체됨(1920×760, 가운데 1350px에 그림) -->
<section class="hero" id="hero" aria-label="추천 게임" aria-roledescription="carousel">
  <div class="hs-track" id="hsTrack"></div>
  <div class="hs-tabs" id="hsTabs" role="tablist"></div>
</section>
<section class="sec1"><div class="wrap">
  <h2 class="h2">내가 읽은 작품의 게임</h2>
  <div class="read"><img src="assets/img/cover_escape_v.jpg" alt="">
    <div class="tx"><h3>저를 가두셨죠?<br>덕분에 전설의 환수를 얻었습니다</h3><div class="chips"><span>방탈출</span><span>판타지</span><span>학원물</span></div>
      <p class="desc">아카데미 평민학생 전설의 환수를 얻다</p>
      <a class="btn-b" href="detail.html?g=escape" data-detail="escape">바로가기</a></div></div>
</div></section>
<section class="pass" id="passBand" role="button" aria-label="게임패스 안내">
  <p class="k"><img src="assets/brand/ridigames_mark_white.svg" alt="">게임패스 30일</p><p class="h">세 게임의 모든 회차가 열려요</p><button class="pill">9,900원</button>
  <div class="art"></div><p class="note">인 게임 내 아이템 별도 구매</p>
</section>
<section class="sec3"><div class="wrap">
  <h2 class="h2">리디 게임 <svg width="16" height="26" viewBox="0 0 16 26" fill="none" stroke="#333" stroke-width="2.2" style="margin-left:6px"><path d="M3 3l10 10L3 23"/></svg></h2>
  <div class="cards">
    <a href="detail.html?g=chat" data-detail="chat"><img src="assets/img/thumb_chat.jpg" alt="저와 공범이 되어 주시겠습니까?"><div class="ci"><p class="t">저와 공범이 되어 주시겠습니까?</p><div class="row"><div class="tg"><span>AI채팅</span><span>로맨스판타지</span></div><p class="f">1화 무료 · 2화부터 게임패스</p></div></div></a>
    <a href="detail.html?g=shoot" data-detail="shoot"><img src="assets/img/thumb_shoot.jpg" alt="지각 사유 : 게이트 폭주"><div class="ci"><p class="t">지각 사유 : 게이트 폭주</p><div class="row"><div class="tg"><span>슈팅</span><span>헌터물</span><span>액션</span></div><p class="f">1화 무료 · 2화부터 게임패스</p></div></div></a>
    <a href="detail.html?g=escape" data-detail="escape"><img src="assets/img/thumb_escape.jpg" alt="저를 가두셨죠?"><div class="ci"><p class="t">저를 가두셨죠?<br>덕분에 전설의 환수를 얻었습니다</p><div class="row"><div class="tg"><span>방탈출</span><span>판타지</span><span>학원물</span></div><p class="f">1화 무료 · 2화부터 게임패스</p></div></div></a>
  </div>
</div></section>
<script>
/* 히어로 슬라이드 — 민지 배너가 오면 img 경로만 바꾸면 됨 */
var HERO = [  /* img: 1672×941(16:9) 배너 · play: 그림 안 "지금 플레이하기" 자리 [x, y, 너비, 높이] (원본 1672 기준 px) */
  { g: 'chat',   img: 'assets/img/hero_chat.jpg',   label: 'AI채팅', title: '저와 공범이 되어 주시겠습니까?', play: [1030, 560, 500, 100] },
  { g: 'shoot',  img: 'assets/img/hero_shoot.jpg',  label: '슈팅',   title: '지각 사유 : 게이트 폭주', play: [945, 510, 605, 120] },
  { g: 'escape', img: 'assets/img/hero_escape.jpg', label: '방탈출', title: '저를 가두셨죠? 덕분에 전설의 환수를 얻었습니다', play: [1000, 605, 530, 100] }
];
(function () {
  var K = 1126 / 1672;  /* 가운데 그림 폭 1126px(높이 634) */
  function pr(p) { return 'left:calc(50% - 542px + ' + Math.round(p[0] * K) + 'px);top:' + Math.round(p[1] * K) + 'px;width:' + Math.round(p[2] * K) + 'px;height:' + Math.round(p[3] * K) + 'px'; }
  var tr = document.getElementById('hsTrack'), tb = document.getElementById('hsTabs'), cur = 0, timer = null, DELAY = 5000;
  tr.innerHTML = HERO.map(function (h, i) {
    return '<div class="hs-slide" aria-hidden="' + (i ? 'true' : 'false') + '"><div class="hs-bg" style="background-image:url(' + h.img + ')"></div><div class="hs-img" style="background-image:url(' + h.img + ')"></div>' +
      '<a class="hs-link" href="detail.html?g=' + h.g + '" data-detail="' + h.g + '" aria-label="' + h.title + ' 상세"></a>' +
      '<a class="hs-play" style="' + pr(h.play) + '" href="ep1.html?g=' + h.g + '" data-play="' + h.g + '" aria-label="' + h.title + ' 지금 플레이하기"></a></div>';
  }).join('');
  tb.innerHTML = HERO.map(function (h, i) {
    return '<button class="hs-t' + (i ? '' : ' on') + '" role="tab" aria-selected="' + (i ? 'false' : 'true') + '" data-i="' + i + '"><small>' + h.label + '</small><b>' + h.title + '</b><i class="bar"></i></button>';
  }).join('');
  function go(i) {
    cur = (i + HERO.length) % HERO.length;
    tr.style.transform = 'translateX(' + (-100 * cur) + '%)';
    tr.querySelectorAll('.hs-slide').forEach(function (s, k) { s.setAttribute('aria-hidden', k === cur ? 'false' : 'true'); });
    tb.querySelectorAll('.hs-t').forEach(function (t, k) { t.classList.toggle('on', k === cur); t.setAttribute('aria-selected', k === cur); });
    restart();
  }
  function restart() { clearTimeout(timer); tb.classList.remove('run'); void tb.offsetWidth; tb.classList.add('run'); timer = setTimeout(function () { go(cur + 1); }, DELAY); }
  tb.addEventListener('click', function (e) { var t = e.target.closest('.hs-t'); if (t) go(+t.dataset.i); });
  var hero = document.getElementById('hero');
  hero.addEventListener('mouseenter', function () { clearTimeout(timer); tb.classList.add('paused'); });
  hero.addEventListener('mouseleave', function () { tb.classList.remove('paused'); restart(); });
  restart();
})();
</script>
<div id="ft"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  // ① 게임 메뉴 메인 진입 (출구 QR이면 utm_content=exit)
  RD.ev('game_tab_view', { utm_source: RD.utm.utm_source || '(direct)', utm_content: RD.utm.utm_content || '(none)' });
  document.querySelectorAll('[data-detail]').forEach(function (a) {
    a.href = a.getAttribute('href') + '&from=game_home';  // 상세가 열릴 때 game_detail_view 한 번만(placement=game_home)
  });
  document.querySelectorAll('[data-play]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); RD.ev('play_start', { game_id: a.dataset.play, placement: 'game_home' }); var h = a.href; setTimeout(function () { location.href = h; }, 150); });
  });
  document.getElementById('passBand').addEventListener('click', function () { RD.openPass('all', 'game_home'); });
});
</script>
</body></html>
